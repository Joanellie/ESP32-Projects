<!DOCTYPE html>           
<html>
    <head>
        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
        <style>
        /* CSS */
        .setHr {                
            font-size: 48px; 
        }
        .newHr {
            font-size: 1.8rem;
        }
        .time-select{
            font-size: 1.8rem;
        }
        .save-button{
            background-color: white;
            border: 2px solid black;
            color: black;
            padding: 20px 50px;
            font-size: 1.4rem;
            display: block;
            margin: 20px auto;
        }
        </style>
    </head>
    <body>
        <h1 id="currentTime" class="setHr">Pet will eat at ${hour}:${minute} pm</h1>
        <p class="newHr">Set new Hr:</p>
        <form action="/saveHr" method="GET">
            <select name="hour" class="time-select">
                <option>01</option>
                <option>02</option>
                <option>03</option>
                <option selected>04</option>
                <option>05</option>
                <option>06</option>
                <option>07</option>
                <option>08</option>
                <option>09</option>
                <option>10</option>
                <option>11</option>
            </select>
            
            :

            <select name="minute" class="time-select">
                <option>00</option>
                <option selected>30</option>
            </select>   

            <p>
                <!-- GET /saveHr?hour=04&minute=30 HTTP/1.1 -->
                <button onclick="updateTime()" type="button" class="save-button">save</button>
            </p> 
        </form> 
        <script>
            function updateTime() {
                const hour = document.querySelector('select[name="hour"]').value;
                const minute = document.querySelector('select[name="minute"]').value;

                const TimeSet = document.getElementById("currentTime");
                TimeSet.textContent = `Pet will eat at ${hour}:${minute} pm`; 
            }
        </script>     
    </body>
</html>
